<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"></meta>
    <title>Nota de serviço</title>
    <style>
        @page {
            size: A4;
            margin: 15mm;
        }
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #000;
        }
        .header-image {
            justify-content: center;
        }
        h1.title {
            text-align: center;
            text-transform: uppercase;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .info-row {
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .info-row span {
            border-bottom: 1px solid #000;
            display: inline-block;
            min-width: 100px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #000;
            padding: 5px;
            text-align: left;
        }
        th {
            background-color: #f0f0f0;
            text-align: center;
        }
        .footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .signature {
            border-top: 1px solid #000;
            width: 250px;
            text-align: center;
            padding-top: 5px;
        }
        .total-box {
            border: 1px solid #000;
            padding: 10px;
            background-color: #d0d0d0;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
<img class="header-image" th:src="${headerBase64}" width="700" alt="Logo da Empresa" />
<h1 class="title">Autorização de Fornecimento</h1>

<div>
    <p><strong>Data:</strong> <strong th:text="${date}"></strong> </p>
    <p><strong>Fone: </strong></p>
    <p><strong>Cliente:</strong> <strong th:text="${customer}"></strong> </p>
    <p><strong>Endereço:</strong></p>
    <p><strong>Cidade:</strong>  <strong>Est.:</strong>  <strong>Cond. Pagamento:</strong>  </p>
</div>

<table>
    <thead>
    <tr>
        <th>Quantidade</th>
        <th>Descrição</th>
        <th>Largura (m)</th>
        <th>Altura (m)</th>
        <th>Preço Unitário (R$)</th>
        <th>Valor Total (R$)</th>
        <th>Data de registro</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="demand : ${demands}">
        <td th:text="${demand.amount}">Quantidade</td>
        <td th:text="${demand.description}">Nome do Item</td>
        <td th:text="${demand.productLength}">Largura(m)</td>
        <td th:text="${demand.productHeight}">Altura(m)</td>
        <td th:text="${demand.unitValue}">Preço unitario</td>
        <td th:text="${demand.value}">R$ 0,00</td>
        <td th:text="${demand.createdString}">Data de criação</td>
    </tr>
    </tbody>
</table>

<div class="footer">
    <div class="total-box">
        <strong>Valor total: R$ </strong><strong th:text="${demandTotalValue}">0,00</strong>
    </div>
</div>
</body>
</html>
